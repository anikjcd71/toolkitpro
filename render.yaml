services:
  - type: web
    name: toolkitpro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health.php
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: toolkit
          property: connectionString
      # MySQL fallback: remove DATABASE_URL mapping and set DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASS.
databases: []
